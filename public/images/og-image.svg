    </g>

    <!-- Card 2 -->
    <g transform="translate(265, 0)">
      <rect width="240" height="180" rx="16" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.2)" />
      <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2a9d99" letter-spacing="0.5">LDL CHOLESTEROL</text>
