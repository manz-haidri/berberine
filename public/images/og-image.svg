      <text x="24" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.75)">JAMA Netw Open 2026</text>
      <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="rgba(255, 255, 255, 0.55)">337 Adults Multicenter RCT</text>
