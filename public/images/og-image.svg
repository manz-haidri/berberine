  <!-- Footer domain & credentials -->
  <line x1="80" y1="510" x2="1120" y2="510" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <text x="80" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    berberinebenefit.com
