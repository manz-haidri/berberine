      <text x="24" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">-0.35</text>
      <text x="130" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.7)">mmol/L</text>
      <text x="24" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.75)">17 Double-Blind RCTs</text>
