  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1100" cy="100" r="350" fill="#0075de" opacity="0.18" filter="blur(80px)" />
  <circle cx="100" cy="550" r="280" fill="#2a9d99" opacity="0.12" filter="blur(70px)" />

  <!-- Top Pill -->
  <g transform="translate(80, 70)">
