<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Dear Apothecary Berberine HCl bottle illustration">
  <defs>
    <linearGradient id="dearBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f6f2"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eceae3"/>
    </linearGradient>
    <linearGradient id="dearCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebe7de"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfdad0"/>
    </linearGradient>
    <filter id="dearShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a2015" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="68" ry="9" fill="#000" opacity="0.08"/>
  <g filter="url(#dearShadow)">
    <!-- White Cap with fine ridges -->
    <rect x="88" y="24" width="64" height="28" rx="4" fill="url(#dearCapGrad)"/>
    <line x1="92" y1="38" x2="148" y2="38" stroke="#d5cebe" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M94 52 L146 52 L152 74 L88 74 Z" fill="#eae6dc"/>
    <!-- Bottle Body -->
    <rect x="54" y="74" width="132" height="216" rx="14" fill="url(#dearBottleGrad)"/>
    <!-- Cream Apothecary Label -->
    <rect x="57" y="86" width="126" height="194" fill="#faf7f0" rx="2" stroke="#e8e0d0" stroke-width="0.8"/>
    <!-- Botanical Emblem -->
    <circle cx="120" cy="112" r="14" fill="#f0ebd9" stroke="#b08d55" stroke-width="1"/>
    <!-- Mortar & Pestle / Botanical branch icon -->
    <path d="M114 116 C114 120, 126 120, 126 116 L124 110 L116 110 Z" fill="#7a5523"/>
    <line x1="123" y1="104" x2="117" y2="114" stroke="#7a5523" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Brand Name -->
    <text x="120" y="136" font-family="'Newsreader', Georgia, serif" font-weight="600" font-size="10" fill="#2d2216" text-anchor="middle" letter-spacing="0.5">DEAR APOTHECARY</text>
    <line x1="75" y1="142" x2="165" y2="142" stroke="#b08d55" stroke-width="0.75"/>
    <!-- Product Name -->
    <text x="120" y="162" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#1f1810" text-anchor="middle" letter-spacing="-0.3">BERBERINE HCl</text>
    <!-- Dosage Highlight Badge -->
    <rect x="74" y="170" width="92" height="18" rx="4" fill="#7a5523"/>
    <text x="120" y="183" font-family="Inter, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">1,200 mg DAILY</text>
    <!-- Formulation Attributes -->
    <text x="120" y="206" font-family="Inter, sans-serif" font-weight="600" font-size="7.5" fill="#7a5523" text-anchor="middle">Dual-Source Root + Bark</text>
    <text x="120" y="217" font-family="Inter, sans-serif" font-weight="500" font-size="7" fill="#665b4c" text-anchor="middle">Berberis aristata Extract</text>
    <text x="120" y="228" font-family="Inter, sans-serif" font-weight="500" font-size="7" fill="#665b4c" text-anchor="middle">Third-Party Lab Tested</text>
    <!-- Seal -->
    <circle cx="120" cy="245" r="9" fill="#ffffff" stroke="#7a5523" stroke-width="0.8"/>
    <text x="120" y="248" font-family="Inter, sans-serif" font-weight="700" font-size="5" fill="#7a5523" text-anchor="middle">GMP</text>
    <!-- Footer -->
    <text x="120" y="267" font-family="Inter, sans-serif" font-weight="600" font-size="8" fill="#2d2216" text-anchor="middle">60 Capsules · 30-Day Supply</text>
  </g>
</svg>
