<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Thorne Berberine Dual-Action bottle illustration">
  <defs>
    <linearGradient id="thorneBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="thorneCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3e3e8"/>
      <stop offset="50%" stop-color="#f7f7fa"/>
      <stop offset="100%" stop-color="#d4d4dc"/>
    </linearGradient>
    <filter id="thorneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141a29" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="72" ry="10" fill="#000" opacity="0.08"/>
  <g filter="url(#thorneShadow)">
    <!-- Cap -->
    <rect x="86" y="24" width="68" height="28" rx="4" fill="url(#thorneCapGrad)"/>
    <line x1="90" y1="38" x2="150" y2="38" stroke="#bcbcc8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M92 52 L148 52 L154 74 L86 74 Z" fill="#e5e5eb"/>
    <!-- Body -->
    <rect x="52" y="74" width="136" height="216" rx="14" fill="url(#thorneBottleGrad)"/>
    <!-- Label -->
    <rect x="55" y="86" width="130" height="194" fill="#ffffff" rx="2"/>
    <!-- Thorne Minimalist Logo Header -->
    <text x="120" y="114" font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#141a29" text-anchor="middle" letter-spacing="3.5">THORNE</text>
    <line x1="75" y1="124" x2="165" y2="124" stroke="#e0dec8" stroke-width="1"/>
    <!-- Product Name -->
    <text x="120" y="152" font-family="Inter, sans-serif" font-weight="700" font-size="14.5" fill="#141a29" text-anchor="middle">Berberine</text>
    <rect x="70" y="160" width="100" height="18" rx="4" fill="#f4f3ed"/>
    <text x="120" y="173" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#665f3f" text-anchor="middle" letter-spacing="0.5">DUAL-ACTION</text>
    <!-- Formulation Breakdown Text -->
    <text x="120" y="198" font-family="Inter, sans-serif" font-weight="500" font-size="8" fill="#585966" text-anchor="middle">HCl + Phytosome Complex</text>
    <text x="120" y="210" font-family="Inter, sans-serif" font-weight="500" font-size="8" fill="#585966" text-anchor="middle">Metabolic Support*</text>
    <!-- Geometric Thorne Accent Icon -->
    <circle cx="120" cy="235" r="13" fill="#faf9f5" stroke="#c4be9d" stroke-width="1"/>
    <polygon points="120,226 127,238 113,238" fill="#c4be9d"/>
    <!-- Package Details -->
    <text x="120" y="265" font-family="Inter, sans-serif" font-weight="600" font-size="8.5" fill="#141a29" text-anchor="middle">60 Capsules · Dietary Supplement</text>
  </g>
</svg>
