<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Nature's Bounty Berberine bottle illustration">
  <defs>
    <linearGradient id="nbBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3d23"/>
      <stop offset="30%" stop-color="#185c34"/>
      <stop offset="70%" stop-color="#185c34"/>
      <stop offset="100%" stop-color="#0b2e1a"/>
    </linearGradient>
    <linearGradient id="nbCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b2e1a"/>
      <stop offset="50%" stop-color="#185c34"/>
      <stop offset="100%" stop-color="#071f11"/>
    </linearGradient>
    <filter id="nbShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071f11" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="68" ry="9" fill="#000" opacity="0.1"/>
  <g filter="url(#nbShadow)">
    <!-- Dark Green Ribbed Cap -->
    <rect x="88" y="24" width="64" height="28" rx="4" fill="url(#nbCapGrad)"/>
    <line x1="92" y1="38" x2="148" y2="38" stroke="#338553" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M94 52 L146 52 L152 74 L88 74 Z" fill="#134729"/>
    <!-- Translucent Dark Green Bottle Body -->
    <rect x="54" y="74" width="132" height="216" rx="14" fill="url(#nbBottleGrad)"/>
    <!-- Label -->
    <rect x="57" y="86" width="126" height="194" fill="#ffffff" rx="2"/>
    <!-- Green Brand Header Banner -->
    <path d="M57 86 L183 86 L183 126 L57 126 Z" fill="#0c4a28"/>
    <text x="120" y="106" font-family="'Newsreader', Georgia, serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NATURE'S BOUNTY</text>
    <text x="120" y="117" font-family="Inter, sans-serif" font-size="6" fill="#a4e3bc" text-anchor="middle" letter-spacing="0.5">NEARLY 50 YEARS OF QUALITY</text>
    <!-- Product Name -->
    <text x="120" y="152" font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#0c4a28" text-anchor="middle">BERBERINE</text>
    <!-- Yellow Dose Pill -->
    <rect x="74" y="160" width="92" height="18" rx="9" fill="#fcd34d"/>
    <text x="120" y="173" font-family="Inter, sans-serif" font-weight="800" font-size="10.5" fill="#78350f" text-anchor="middle">1000 mg</text>
    <text x="120" y="196" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#4b5563" text-anchor="middle">Per 2 Capsule Serving</text>
    <text x="120" y="208" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#4b5563" text-anchor="middle">Supports Heart &amp; Glucose Health*</text>
    <!-- Herb Source -->
    <rect x="76" y="220" width="88" height="14" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="120" y="230" font-family="Inter, sans-serif" font-weight="600" font-size="7" fill="#15803d" text-anchor="middle">Berberis aristata bark</text>
    <!-- Non-GMO seal -->
    <text x="120" y="250" font-family="Inter, sans-serif" font-weight="600" font-size="6.5" fill="#6b7280" text-anchor="middle">NON-GMO · GLUTEN FREE</text>
    <!-- Package Details -->
    <text x="120" y="268" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#0c4a28" text-anchor="middle">60 Capsules</text>
  </g>
</svg>
