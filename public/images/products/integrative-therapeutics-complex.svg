<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Integrative Therapeutics Berberine Complex bottle illustration">
  <defs>
    <linearGradient id="itBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f7f5"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3e8e3"/>
    </linearGradient>
    <linearGradient id="itCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144d2d"/>
      <stop offset="50%" stop-color="#236b41"/>
      <stop offset="100%" stop-color="#0e3d23"/>
    </linearGradient>
    <filter id="itShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141a29" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="72" ry="10" fill="#000" opacity="0.08"/>
  <g filter="url(#itShadow)">
    <!-- Cap (Forest Green) -->
    <rect x="86" y="24" width="68" height="28" rx="4" fill="url(#itCapGrad)"/>
    <line x1="90" y1="38" x2="150" y2="38" stroke="#489167" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M92 52 L148 52 L154 74 L86 74 Z" fill="#e5ebe5"/>
    <!-- Body -->
    <rect x="52" y="74" width="136" height="216" rx="14" fill="url(#itBottleGrad)"/>
    <!-- Label -->
    <rect x="55" y="86" width="130" height="194" fill="#ffffff" rx="2"/>
    <!-- Header Green Band -->
    <path d="M55 86 L185 86 L185 118 L55 118 Z" fill="#1b4d2e"/>
    <text x="120" y="102" font-family="Inter, sans-serif" font-weight="700" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">INTEGRATIVE</text>
    <text x="120" y="112" font-family="Inter, sans-serif" font-weight="500" font-size="6" fill="#a8d6b9" text-anchor="middle" letter-spacing="1">THERAPEUTICS</text>
    <!-- Botanical Motif Leaf -->
    <circle cx="120" cy="132" r="9" fill="#e8f5ed"/>
    <path d="M120 126 C124 130, 124 135, 120 138 C116 135, 116 130, 120 126 Z" fill="#1b4d2e"/>
    <!-- Product Name -->
    <text x="120" y="156" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#142e1d" text-anchor="middle">Berberine</text>
    <text x="120" y="170" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#287346" text-anchor="middle">Complex</text>
    <!-- Blend Spec -->
    <rect x="68" y="178" width="104" height="16" rx="4" fill="#eef7f1"/>
    <text x="120" y="189" font-family="Inter, sans-serif" font-weight="600" font-size="7.5" fill="#1b4d2e" text-anchor="middle">Barberry · Oregon Grape · Goldenseal</text>
    <!-- Description -->
    <text x="120" y="212" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#526357" text-anchor="middle">Multi-Botanical Herbal Blend*</text>
    <text x="120" y="223" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#526357" text-anchor="middle">GI &amp; Immune Support*</text>
    <!-- Tag -->
    <rect x="76" y="234" width="88" height="12" rx="3" fill="#f4f7f4"/>
    <text x="120" y="242" font-family="Inter, sans-serif" font-weight="600" font-size="6.5" fill="#395941" text-anchor="middle">DAIRY FREE · VEGETARIAN</text>
    <!-- Footer on label -->
    <text x="120" y="265" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#142e1d" text-anchor="middle">90 Capsules</text>
  </g>
</svg>
