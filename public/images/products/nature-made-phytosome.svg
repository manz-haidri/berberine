<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Nature Made Better Absorption Berberine Phytosome bottle illustration">
  <defs>
    <linearGradient id="nmBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfcf7"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f0ebe0"/>
    </linearGradient>
    <linearGradient id="nmCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99700"/>
      <stop offset="50%" stop-color="#f5c227"/>
      <stop offset="100%" stop-color="#ab7f00"/>
    </linearGradient>
    <filter id="nmShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141a29" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="72" ry="10" fill="#000" opacity="0.08"/>
  <g filter="url(#nmShadow)">
    <!-- Cap (Golden Yellow) -->
    <rect x="86" y="24" width="68" height="28" rx="4" fill="url(#nmCapGrad)"/>
    <line x1="90" y1="38" x2="150" y2="38" stroke="#ffe58f" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M92 52 L148 52 L154 74 L86 74 Z" fill="#eee8dc"/>
    <!-- Body -->
    <rect x="52" y="74" width="136" height="216" rx="14" fill="url(#nmBottleGrad)"/>
    <!-- Label -->
    <rect x="55" y="86" width="130" height="194" fill="#fffdf2" rx="2"/>
    <!-- Yellow Header Banner -->
    <path d="M55 86 L185 86 L185 128 L55 128 Z" fill="#ffd53d"/>
    <!-- Nature Made Red Diamond Logo -->
    <polygon points="120,92 136,108 120,124 104,108" fill="#d91424"/>
    <text x="120" y="111" font-family="Inter, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">NM</text>
    <!-- Brand Name Under Banner -->
    <text x="120" y="142" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1f1d17" text-anchor="middle" letter-spacing="0.5">Nature Made.</text>
    <!-- Product Name -->
    <text x="120" y="160" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1f1d17" text-anchor="middle">BERBERINE</text>
    <rect x="70" y="166" width="100" height="16" rx="8" fill="#d91424"/>
    <text x="120" y="177" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.4">PHYTOSOME 550 mg</text>
    <!-- Subtitle -->
    <text x="120" y="200" font-family="Inter, sans-serif" font-weight="600" font-size="8" fill="#a87103" text-anchor="middle">Better Absorption‡</text>
    <text x="120" y="212" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#595549" text-anchor="middle">Clinically Studied Form*</text>
    <text x="120" y="223" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#595549" text-anchor="middle">Supports Glucose Metabolism*</text>
    <!-- Capsule Count Badge -->
    <rect x="80" y="234" width="80" height="13" rx="3" fill="#f5ede0"/>
    <text x="120" y="243" font-family="Inter, sans-serif" font-weight="600" font-size="7" fill="#6e572b" text-anchor="middle">GLUTEN FREE · 1-2 DAILY</text>
    <!-- Bottom package count -->
    <text x="120" y="266" font-family="Inter, sans-serif" font-weight="700" font-size="9" fill="#1f1d17" text-anchor="middle">60 Capsules</text>
  </g>
</svg>
