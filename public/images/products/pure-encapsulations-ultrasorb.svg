<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="Pure Encapsulations Berberine UltraSorb bottle illustration">
  <defs>
    <linearGradient id="pureBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6f7fa"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaf0"/>
    </linearGradient>
    <linearGradient id="pureCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6e9f2"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce0ed"/>
    </linearGradient>
    <filter id="pureShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141a29" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="298" rx="72" ry="10" fill="#000" opacity="0.08"/>
  <g filter="url(#pureShadow)">
    <!-- Cap -->
    <rect x="86" y="24" width="68" height="28" rx="4" fill="url(#pureCapGrad)"/>
    <line x1="90" y1="38" x2="150" y2="38" stroke="#cbd2e3" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M92 52 L148 52 L154 74 L86 74 Z" fill="#ebedf5"/>
    <!-- Body -->
    <rect x="52" y="74" width="136" height="216" rx="14" fill="url(#pureBottleGrad)"/>
    <!-- Label -->
    <rect x="55" y="86" width="130" height="194" fill="#ffffff" rx="2"/>
    <!-- Logo -->
    <rect x="66" y="98" width="108" height="22" rx="3" fill="#003d7a"/>
    <text x="120" y="112" font-family="Inter, sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">pure encapsulations</text>
    <text x="120" y="118" font-family="Inter, sans-serif" font-size="5" fill="#a4c4e8" text-anchor="middle">FREE FROM UNNECESSARY ADDITIVES</text>
    <!-- Product Name -->
    <text x="120" y="148" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1f2430" text-anchor="middle">Berberine</text>
    <text x="120" y="162" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#0075de" text-anchor="middle">UltraSorb</text>
    <!-- Spec Badge -->
    <rect x="72" y="170" width="96" height="18" rx="4" fill="#e8f3fc"/>
    <text x="120" y="183" font-family="Inter, sans-serif" font-weight="700" font-size="9" fill="#005bab" text-anchor="middle">550 mg Berbevis®</text>
    <!-- Description -->
    <text x="120" y="206" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#5c6270" text-anchor="middle">Enhanced Bioavailability Phytosome</text>
    <text x="120" y="217" font-family="Inter, sans-serif" font-weight="500" font-size="7.5" fill="#5c6270" text-anchor="middle">Metabolic &amp; Glucose Support*</text>
    <!-- Hypoallergenic Pill -->
    <rect x="76" y="226" width="88" height="14" rx="7" fill="#f0faf4" stroke="#a3e3ba" stroke-width="0.8"/>
    <text x="120" y="236" font-family="Inter, sans-serif" font-weight="600" font-size="7" fill="#1b783d" text-anchor="middle">Hypoallergenic · Non-GMO</text>
    <!-- Package Details -->
    <text x="120" y="265" font-family="Inter, sans-serif" font-weight="600" font-size="8.5" fill="#2d3342" text-anchor="middle">60 Capsules</text>
  </g>
</svg>
