<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%" role="img" aria-label="NOW Foods Berberine 500 mg bottle illustration">
  <defs>
    <linearGradient id="nowBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fbfaf8"/>
      <stop offset="100%" stop-color="#e3ded7"/>
    </linearGradient>
    <linearGradient id="nowCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d95400"/>
      <stop offset="50%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#c44600"/>
    </linearGradient>
    <filter id="bottleShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141a29" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Drop Shadow & Base -->
  <ellipse cx="120" cy="298" rx="72" ry="10" fill="#000" opacity="0.08"/>
  <!-- Bottle Body -->
  <g filter="url(#bottleShadow)">
    <!-- Cap -->
    <rect x="86" y="24" width="68" height="28" rx="5" fill="url(#nowCapGrad)"/>
    <line x1="90" y1="38" x2="150" y2="38" stroke="#ffa366" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Neck -->
    <path d="M92 52 L148 52 L154 74 L86 74 Z" fill="#ebe6df"/>
    <!-- Body -->
    <rect x="52" y="74" width="136" height="216" rx="16" fill="url(#nowBottleGrad)"/>
    <!-- Label Background -->
    <rect x="54" y="88" width="132" height="190" fill="#ffffff" rx="2"/>
    <!-- Label Header: NOW Orange/Purple Band -->
    <path d="M54 88 L186 88 L186 130 L54 130 Z" fill="#ff6b00"/>
    <ellipse cx="120" cy="116" rx="36" ry="16" fill="#3b1b6a"/>
    <text x="120" y="122" font-family="Inter, sans-serif" font-weight="900" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="1">now</text>
    <!-- Label Body Details -->
    <text x="120" y="152" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#24211e" text-anchor="middle" letter-spacing="-0.3">BERBERINE</text>
    <rect x="74" y="158" width="92" height="18" rx="9" fill="#f4ece1"/>
    <text x="120" y="171" font-family="Inter, sans-serif" font-weight="700" font-size="10.5" fill="#c44600" text-anchor="middle">500 mg HCl</text>
    <!-- Supporting Text -->
    <text x="120" y="196" font-family="Inter, sans-serif" font-weight="500" font-size="8.5" fill="#595550" text-anchor="middle">Glucose Metabolism*</text>
    <text x="120" y="208" font-family="Inter, sans-serif" font-weight="500" font-size="8.5" fill="#595550" text-anchor="middle">Supports Lipid Levels*</text>
    <!-- Seal / Attributes -->
    <circle cx="120" cy="232" r="14" fill="#f0faf2" stroke="#1aae39" stroke-width="1"/>
    <text x="120" y="235" font-family="Inter, sans-serif" font-weight="700" font-size="7" fill="#0f6e24" text-anchor="middle">NON-GMO</text>
    <!-- Footer on Label -->
    <text x="120" y="264" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#1f1e1c" text-anchor="middle">90 Veg Capsules</text>
  </g>
</svg>
